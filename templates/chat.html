{% extends 'base.html' %}
{% block title %}大厅 · 御宅喵论坛{% endblock %}
{% block content %}
<div class="page-head">
  <h1 class="page-title">📚 大厅</h1>
  <a href="{{ url_for('new_post') }}" class="btn btn-primary">+ 发帖</a>
</div>
{% for p in posts %}
<a class="post-item" href="{{ url_for('post_detail', post_id=p.id) }}">
  <span class="post-item-title">{{ p.title }}</span>
  <span class="post-item-meta">{{ p.created_at.strftime('%Y-%m-%d %H:%M') }} · {{ p.replies|length }} 回复</span>
</a>
{% else %}
<div class="empty">暂无帖子</div>
{% endfor %}
{% endblock %}
