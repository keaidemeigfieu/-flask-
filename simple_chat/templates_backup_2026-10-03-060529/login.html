<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>登录 - 御宅喵论坛</title>
    <style>
        body { font-family: Arial; max-width:400px; margin:50px auto; padding:20px; }
        input, button { width:100%; padding:10px; margin:8px 0; box-sizing:border-box; }
        button { background:#1a73e8; color:white; border:none; border-radius:4px; cursor:pointer; }
        .back { margin-top:15px; display:block; text-align:center; }
    </style>
</head>
<body>
    <h2>登录</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="用户名" required>
        <input type="password" name="password" placeholder="密码" required>
        <button type="submit">登录</button>
    </form>
    <div class="back">
        还没有账号？<a href="{{ url_for('register') }}">去注册</a>
        <br><a href="{{ url_for('chat') }}">← 返回御宅喵论坛</a>
    </div>
</body>
</html>
