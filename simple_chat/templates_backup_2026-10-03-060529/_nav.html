<nav style="background:#fff; border-bottom:1px solid #eee;">
  <div style="max-width:860px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
    <a href="{{ url_for('chat') }}" style="color:#1a73e8; text-decoration:none; font-weight:bold;">御宅喵论坛=ᗜωᗜ=</a>
    <a href="{{ url_for('moments') }}" style="color:#333; text-decoration:none;">动态</a>
    <a href="{{ url_for('new_post') }}" style="color:#333; text-decoration:none;">发帖</a>
    <a href="{{ url_for('new_moment') }}" style="color:#333; text-decoration:none;">发动态</a>
    <a href="{{ url_for('search') }}" style="color:#333; text-decoration:none;">搜索</a>
    <span style="flex:1;"></span>

      <a href="{{ url_for('logout') }}" style="color:#999; text-decoration:none;">退出</a>
    {% else %}
      <a href="{{ url_for('login') }}" style="color:#333; text-decoration:none;">登录</a>
      <a href="{{ url_for('register') }}" style="color:#333; text-decoration:none;">注册</a>
